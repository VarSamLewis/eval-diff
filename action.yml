name: "Eval Diff"
description: "Sends Git diffs to the TypeSafe Jev API to evaluate change impact and breaking-change risk"
branding:
  icon: "activity"
  color: "purple"
  
inputs:
  typesafe_api_key:
    description: "API key for evaluation service"
    required: true
  format:
    description: "Output format"
    required: false
    default: "standard"
  max_chars:
    description: "Maximum diff character limit"
    required: false
    default: "4000"
  dry_run:
    description: "Run without calling external API"
    required: false
    default: "false"

outputs:
  impact_score:
    description: "Impact score"
    value: ${{ steps.eval_step.outputs.impact_score }}
  confidence:
    description: "Confidence score"
    value: ${{ steps.eval_step.outputs.confidence }}
  is_breaking:
    description: "Breaking change flag"
    value: ${{ steps.eval_step.outputs.is_breaking }}

runs:
  using: "composite"
  steps:
    - name: Run Docker Container
      id: eval_step
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.typesafe_api_key }}
      run: |
        CONTAINER_DIGEST_FILE="${{ github.action_path }}/CONTAINER_DIGEST"
        if [ ! -r "$CONTAINER_DIGEST_FILE" ]; then
          echo "::error::CONTAINER_DIGEST file is missing or unreadable"
          exit 1
        fi
        CONTAINER_DIGEST="$(tr -d '\r\n' < "$CONTAINER_DIGEST_FILE")"
        if ! [[ "$CONTAINER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::CONTAINER_DIGEST must be a sha256 image digest"
          exit 1
        fi

        IMAGE_REF="ghcr.io/varsamlewis/eval-diff@${CONTAINER_DIGEST}"

        if [ -z "${GITHUB_OUTPUT:-}" ] || [ ! -w "$GITHUB_OUTPUT" ]; then
          echo "::error::GitHub Actions output file is unavailable"
          exit 1
        fi

        DIFF_OUTPUT=$(git diff origin/main...HEAD)

        echo "$DIFF_OUTPUT" | docker run --rm -i \
          --user "$(id -u):$(id -g)" \
          -e TYPESAFE_API_KEY="${TYPESAFE_API_KEY}" \
          -e GITHUB_OUTPUT="/github-output" \
          -v "$GITHUB_OUTPUT:/github-output:rw" \
          "$IMAGE_REF" \
          --format="${{ inputs.format }}" \
          --max-chars="${{ inputs.max_chars }}" \
          --dry-run="${{ inputs.dry_run }}"
