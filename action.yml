name: "System One Model Diff Evaluator"
description: "Evaluates git diff impact severity using a System One Model API"
author: "VarSamLewis"

inputs:
  typesafe_api_key:
    description: "TypeSafe Jev API Key"
    required: true
  format:
    description: "Output format: 'standard', 'score', or 'full'"
    required: false
    default: "standard"
  max_chars:
    description: "Maximum character limit for diff content truncation"
    required: false
    default: "100000"
  dry_run:
    description: "Print payload stats without invoking the API"
    required: false
    default: "false"
  target_branch:
    description: "Target branch for comparison (defaults to PR base ref or main)"
    required: false
    default: "${{ github.base_ref || 'main' }}"

outputs:
  impact_score:
    description: "Impact score on a 1.0 - 5.0 scale"
    value: ${{ steps.eval_step.outputs.impact_score }}
  confidence:
    description: "Model confidence rating (0.0 - 1.0)"
    value: ${{ steps.eval_step.outputs.confidence }}
  is_breaking:
    description: "Boolean flag indicating high probability of breaking changes"
    value: ${{ steps.eval_step.outputs.is_breaking }}

runs:
  using: "composite"
  steps:
    - name: Ensure target branch ref is present
      shell: bash
      run: |
        git fetch origin ${{ inputs.target_branch }} --depth=1 || true

    - name: Generate Diff and Execute Evaluation
      id: eval_step
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.typesafe_api_key }}
      run: |
        DIFF_OUTPUT=$(git diff origin/${{ inputs.target_branch }}...HEAD)

        if [ -z "$DIFF_OUTPUT" ]; then
          echo "No diff detected between HEAD and origin/${{ inputs.target_branch }}."
          exit 0
        fi

        echo "$DIFF_OUTPUT" | docker run --rm -i \
          -e TYPESAFE_API_KEY="${TYPESAFE_API_KEY}" \
          -e GITHUB_OUTPUT="/tmp/gh_output" \
          -v /tmp:/tmp \
          ghcr.io/varsamlewis/eval-diff:v0.0.1 \
          --format="${{ inputs.format }}" \
          --max-chars="${{ inputs.max_chars }}" \
          --dry-run="${{ inputs.dry_run }}"

        if [ -f /tmp/gh_output ]; then
          cat /tmp/gh_output >> $GITHUB_OUTPUT
          rm -f /tmp/gh_output
        fi
