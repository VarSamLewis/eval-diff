name: "Eval Diff"
description: "Sends Git diffs to the TypeSafe Jev API to evaluate change impact and breaking-change risk"
branding:
  icon: "activity"
  color: "purple"
  
inputs:
  typesafe_api_key:
    description: "API key for evaluation service"
    required: true
  format:
    description: "Output format"
    required: false
    default: "standard"
  max_chars:
    description: "Maximum diff character limit"
    required: false
    default: "4000"
  dry_run:
    description: "Run without calling external API"
    required: false
    default: "false"

outputs:
  impact_score:
    description: "Impact score"
    value: ${{ steps.eval_step.outputs.impact_score }}
  confidence:
    description: "Confidence score"
    value: ${{ steps.eval_step.outputs.confidence }}
  is_breaking:
    description: "Breaking change flag"
    value: ${{ steps.eval_step.outputs.is_breaking }}

runs:
  using: "composite"
  steps:
    - name: Run Docker Container
      id: eval_step
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.typesafe_api_key }}
      run: |
        IMAGE_TAG="${{ github.action_ref }}"

        if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "main" ]; then
          IMAGE_TAG="latest"
        fi

        DIFF_OUTPUT=$(git diff origin/main...HEAD)

        echo "$DIFF_OUTPUT" | docker run --rm -i \
          -e TYPESAFE_API_KEY="${TYPESAFE_API_KEY}" \
          -e GITHUB_OUTPUT="/tmp/gh_output" \
          -v /tmp:/tmp \
          "ghcr.io/varsamlewis/eval-diff:${IMAGE_TAG}" \
          --format="${{ inputs.format }}" \
          --max-chars="${{ inputs.max_chars }}" \
          --dry-run="${{ inputs.dry_run }}"
