name: Release Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '\n\r')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

          # Extract major version (e.g., v1 from v1.0.5)
          MAJOR_VERSION=$(echo "v${VERSION}" | cut -d. -f1)
          echo "major_version=${MAJOR_VERSION}" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.get_version.outputs.version }}
          git tag -f ${{ steps.get_version.outputs.major_version }}
          git push origin ${{ steps.get_version.outputs.version }} --force
          git push origin ${{ steps.get_version.outputs.major_version }} --force

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/varsamlewis/eval-diff:latest
            ghcr.io/varsamlewis/eval-diff:${{ steps.get_version.outputs.version }}
            ghcr.io/varsamlewis/eval-diff:${{ steps.get_version.outputs.major_version }}
