name: Release Docker Image

on:
  workflow_dispatch:

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Container Version
        id: container_version
        run: |
          VERSION=$(tr -d '\n\r' < CONTAINER_VERSION)
          test -n "$VERSION"
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/varsamlewis/eval-diff:${{ steps.container_version.outputs.tag }}

      - name: Verify published image
        run: docker buildx imagetools inspect "ghcr.io/varsamlewis/eval-diff:${{ steps.container_version.outputs.tag }}"

      - name: Write release summary
        run: |
          echo "## Container image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`ghcr.io/varsamlewis/eval-diff:${{ steps.container_version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
