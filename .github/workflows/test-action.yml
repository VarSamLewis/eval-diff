name: PR Diff Impact Evaluation

on:
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build action image from this pull request
        run: docker build -t eval-diff:pr .

      - name: Smoke-test the image built from this pull request
        run: git diff origin/main...HEAD | docker run --rm -i eval-diff:pr --dry-run=true

      - name: Evaluate PR Diff
        id: eval
        uses: ./
        with:
          format: "standard"
          dry_run: true
